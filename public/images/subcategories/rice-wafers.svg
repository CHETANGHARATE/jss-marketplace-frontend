<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <defs>
    <!-- Background Multi-Stop Gradient -->
    <linearGradient id="bg_rice_papad_chawal_wafers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#757575" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>

    <!-- Inner Glow Ring -->
    <radialGradient id="glow_rice_papad_chawal_wafers" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Studio Pedestal Shadow -->
    <filter id="shadow_rice_papad_chawal_wafers" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <filter id="badge_shadow_rice_papad_chawal_wafers" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Card Canvas -->
  <rect width="360" height="260" rx="20" fill="url(#bg_rice_papad_chawal_wafers)" />

  <!-- Radial Glow Backdrop -->
  <circle cx="180" cy="110" r="75" fill="url(#glow_rice_papad_chawal_wafers)" />

  <!-- Studio Emblem Pedestal -->
  <circle cx="180" cy="110" r="54" fill="#FFFFFF" fill-opacity="0.25" />
  <circle cx="180" cy="110" r="44" fill="#FFFFFF" filter="url(#shadow_rice_papad_chawal_wafers)" />

  <!-- Center Product Icon -->
  <text x="180" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" text-anchor="middle">🍚</text>

  <!-- Glassmorphism Label Badge -->
  <rect x="24" y="190" width="312" height="50" rx="14" fill="#FFFFFF" fill-opacity="0.95" filter="url(#badge_shadow_rice_papad_chawal_wafers)" />
  
  <!-- Subtle Top Border Highlight on Badge -->
  <rect x="24" y="190" width="312" height="2" rx="1" fill="#757575" fill-opacity="0.3" />

  <!-- Category Title -->
  <text x="180" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.3">Rice Papad & Wafers</text>
</svg>