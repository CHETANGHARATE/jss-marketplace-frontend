
name: Deploy JDSmart Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jdsmart-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.jdsmart.in/api/v1
          NEXT_PUBLIC_APP_URL: https://jdsmart.in

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "Missing VPS_KNOWN_HOSTS secret"
            exit 1
          fi

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/jdsmart-frontend

          # Do not overwrite uncommitted tracked files.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Deployment stopped: working tree is not clean."
            git status --short
            exit 1
          fi

          # Use the verified GitHub key configured on this VPS.
          export GIT_SSH_COMMAND="ssh -i /home/jdsadmin/.ssh/jdsmart_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Deployment stopped: VPS branch diverged from origin/main."
            exit 1
          }

          git merge --ff-only origin/main
          npm ci
          npm run build
          pm2 restart jdsmart-frontend --update-env
          pm2 save

          echo "Waiting for frontend health check..."

for attempt in $(seq 1 12); do
  if curl --fail --silent --show-error \
    --max-time 5 \
    http://127.0.0.1:3000/ -o /dev/null; then
    echo "Frontend health check passed."
    exit 0
  fi

  echo "Attempt $attempt failed; waiting 5 seconds..."
  sleep 5
done

echo "Frontend health check failed after retries."
pm2 logs jdsmart-frontend --lines 50 --nostream
exit 1

          echo "Frontend deployment completed successfully."
          REMOTE
